# Publishes an OTA update (EAS Update) of the Android app to the `production` channel. Manual only: Actions tab →
# "Publish OTA" → Run workflow (from main), or `gh workflow run publish-ota.yml --ref main -f message="…"`.
#
# It refuses to publish code with native changes (no production build has its fingerprint, see scripts/ota-guard.sh):
# those need a store build. An OTA cannot bump the app version (a fingerprint input), so each one is counted on top of
# the store version instead: tag vX.Y.Z+ota.N, shown in-app as "X.Y.Z · OTA N" (EXPO_PUBLIC_OTA_REVISION).
#
# Needs the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens).

name: Publish OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: "What the OTA fixes (default: last commit subject)"
        required: false
        type: string

concurrency:
  group: publish-ota
  # Queue, never cancel: a run cancelled after `eas update` leaves a live OTA without its tag, and the next run would
  # reuse its revision number.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish OTA to production
    runs-on: ubuntu-latest
    permissions:
      contents: write # the vX.Y.Z+ota.N tag and its GitHub Release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Guard ref is main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Production OTAs ship from main (this run is on '${{ github.ref_name }}')."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: expo/expo-github-action@v8
        with:
          # Pinned: the fingerprint (runtimeVersion) is computed inside eas-cli, and a version hashing differently would
          # fail the guard on every OTA until a rebuild. Bump it deliberately, together with scripts/ota-guard.sh.
          eas-version: 25.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # An OTA lands on every installed app at its next launches: no broken bundle goes out.
      - name: Checks
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit
          yarn lint
          node scripts/i18n.test.mjs
          node scripts/vault.test.mjs

      - name: Guard against native changes
        run: EAS=eas bash scripts/ota-guard.sh

      - name: Resolve version, revision and message
        id: meta
        env:
          INPUT_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          # N-th OTA on top of store version X.Y.Z: the first free vX.Y.Z+ota.N tag (it restarts at 1 on a store release).
          revision=1
          while git ls-remote --exit-code --tags origin "refs/tags/v$version+ota.$revision" >/dev/null; do
            revision=$((revision + 1))
          done
          message="$INPUT_MESSAGE"
          [ -n "$message" ] || message=$(git log -1 --pretty=%s)
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "tag=v$version+ota.$revision"
            echo "sha=$(git rev-parse HEAD)"
            echo "message<<__EOF__"
            echo "$message"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish OTA
        env:
          # Inlined into the bundle (not into app.config.ts: that would change the fingerprint and orphan the update).
          EXPO_PUBLIC_OTA_REVISION: ${{ steps.meta.outputs.revision }}
          TAG: ${{ steps.meta.outputs.tag }}
          MESSAGE: ${{ steps.meta.outputs.message }}
        run: |
          eas update --channel production --environment production --platform android \
            --message "$TAG · $MESSAGE" --non-interactive

      # The OTA is already live here: a failure below must not hide that, so it only warns.
      - name: Tag and GitHub Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ steps.meta.outputs.revision }}
          MESSAGE: ${{ steps.meta.outputs.message }}
        run: |
          set -euo pipefail
          printf '📱 Mobile — OTA update on top of v%s\n\n- %s\n' "$VERSION" "$MESSAGE" > /tmp/ota-notes.md
          # --latest=false: "latest" must stay the store/desktop release (the in-app update check and the Tauri updater
          # read releases/latest).
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Mobile v$VERSION · OTA $REVISION" --notes-file /tmp/ota-notes.md --latest=false

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MESSAGE: ${{ steps.meta.outputs.message }}
          RELEASE: ${{ steps.release.outcome }}
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### ✅ OTA published: \`$TAG\`"
              echo
              echo "$MESSAGE"
              echo
              echo "Installed apps download it at the next launch and run it from the one after."
              [ "$RELEASE" = "success" ] || echo "⚠️ The OTA is live, but its tag/GitHub Release failed: create \`$TAG\` by hand."
            else
              echo "### ❌ OTA not published"
              echo
              echo "See the failed step. \"No production build has this fingerprint\" means native changes: ship a store build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
