name: "publish"

# Builds the desktop app (macOS arm/Intel, Linux, Windows) into a GitHub release and writes its updater manifest
# (latest.json). Installed apps read releases/latest/download/latest.json; the website's /api/version reads the mobile
# version from the latest release's tag and the desktop one from that latest.json. Manual only: Actions tab → "publish".
#
# - Default: the release of a store version, tag vX.Y.Z (package.json: the mobile version) "(+ Desktop)", with the mobile
#   and desktop changelogs. It becomes GitHub's latest release.
# - desktop_only (a desktop hotfix, the mobile version unchanged): its own release, tag desktop-vX.Y.Z (tauri.conf.json),
#   never GitHub's latest (its tag would read as the mobile version). The latest release's latest.json is then pointed at
#   its builds, so installed apps and the website see it. Its version must be newer than the one published.
#
# A release holds one desktop version: the macOS update archives carry no version in their name (Fast.Memo_aarch64.app
# .tar.gz), so a second version in the same release would mix with the first.

on:
  workflow_dispatch:
    inputs:
      desktop_only:
        description: "Desktop only (a hotfix): own tag desktop-vX.Y.Z, not GitHub's latest; installed apps are pointed to it"
        type: boolean
        default: false

concurrency:
  group: publish
  # Queue, never cancel: a run cancelled between the builds and latest.json leaves a release the apps aren't pointed to.
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      desktop_version: ${{ steps.release.outputs.desktop_version }}
      body: ${{ steps.release_body.outputs.content }}
    steps:
      - uses: actions/checkout@v4

      - name: release tag and name
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
        run: |
          set -eo pipefail
          mobile=$(jq -r '.version' package.json)
          desktop=$(jq -r '.version' src-tauri/tauri.conf.json)

          # A release's asset names, after "@exists" (nothing: no such release). Any other failure stops the run: no guard
          # below may be skipped because a lookup failed.
          release() {
            local out
            if out=$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json assets -q '"@exists", .assets[].name' 2>&1); then
              printf '%s\n' "$out"
            elif [[ "$out" != *"release not found"* ]]; then
              echo "::error::Can't read the release $1: $out" >&2
              return 1
            fi
          }
          # The desktop versions in asset names (the macOS update archives carry none).
          versions_in() { grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u || true; }
          # Whether version $1 is newer than $2.
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

          # The desktop version installed apps are offered now: the latest release's latest.json.
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          latest_assets=$(release "$latest_tag")
          published=""
          if grep -qx 'latest.json' <<< "$latest_assets"; then
            published=$(gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output - \
              | jq -r '.version')
          fi
          echo "Latest release $latest_tag offers desktop ${published:-nothing}"

          if [ "$DESKTOP_ONLY" = "true" ]; then
            tag="desktop-v$desktop"
            name="Desktop v$desktop"
            if [ -n "$published" ] && ! newer "$desktop" "$published"; then
              echo "::error::Desktop $desktop isn't newer than the published $published: bump src-tauri/tauri.conf.json"
              exit 1
            fi
            if [ -n "$(release "$tag")" ]; then
              echo "::error::The release $tag already exists (a failed run: re-run its failed jobs, or delete it and its tag)"
              exit 1
            fi
          else
            tag="v$mobile"
            name="v$mobile (+ Desktop)"
            # A re-run of the same release is fine; builds of another desktop version in it are not (see the top).
            others=$(release "$tag" | versions_in | grep -vxF "$desktop" || true)
            if [ -n "$others" ]; then
              echo "::error::$tag already holds desktop builds of ${others//$'\n'/ }: bump package.json, or run with desktop_only"
              exit 1
            fi
            if [ -n "$published" ] && newer "$published" "$desktop"; then
              echo "::error::Desktop $desktop is older than the published $published (a hotfix this branch misses?)"
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "name=$name"
            echo "desktop_version=$desktop"
          } >> "$GITHUB_OUTPUT"

      - name: compose release body
        id: release_body
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
          TAG: ${{ steps.release.outputs.tag }}
          DESKTOP: ${{ steps.release.outputs.desktop_version }}
        run: |
          set -eo pipefail
          # The user changelog (en.ts), the same text the app, Play and the desktop updater show; the step fails if it's missing.
          desktop_notes=$(node scripts/changelog-notes.mjs web "$DESKTOP")
          body="## 🖥 Desktop $DESKTOP"$'\n\n'"$desktop_notes"

          if [ "$DESKTOP_ONLY" != "true" ]; then
            mobile=$(jq -r '.version' package.json)
            mobile_notes=$(node scripts/changelog-notes.mjs mobile "$mobile")
            body="## 📱 Mobile $mobile"$'\n\n'"$mobile_notes"$'\n\n'"$body"

            # Everything else is in the commits: link the comparison with the release before this one.
            previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$previous" ] && [ "$previous" != "$TAG" ]; then
              body+=$'\n\n'"**Full changes:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          fi

          # A delimiter no changelog line can be.
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "content<<$delimiter"
            echo "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # tauri-action would create it as GitHub's latest release; it uploads into one that exists.
      - name: create the desktop-only release (not the latest)
        if: inputs.desktop_only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          NAME: ${{ steps.release.outputs.name }}
          BODY: ${{ steps.release_body.outputs.content }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$NAME" --notes "$BODY" --latest=false

  publish-tauri:
    needs: prepare
    permissions:
      contents: write
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15-intel" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # Expo SDK 58 / React Native 0.88 need Node >= 22.13
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          # Tauri 2 builds against WebKitGTK 4.1 (4.0 was Tauri 1's).
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: yarn install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri signing (Tauri 2's variable names; same key and secrets as before, so v1 installs accept the update)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # App config — GitHub variables of the `production` environment (the `env` context is never
          # set in this workflow, so these used to be inlined as empty strings)
          EXPO_PUBLIC_ENV: ${{ vars.EXPO_PUBLIC_ENV || 'PROD' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          # Sentry
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.name }}
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  reconstruct-latest-json:
    needs: [prepare, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: extract user-facing changelog from en.ts
        id: desktop_notes
        env:
          VERSION: ${{ needs.prepare.outputs.desktop_version }}
        run: |
          set -eo pipefail
          # latest.json shows what users read in-app (changelog.web.description_X_Y_Z); prepare already checked it exists.
          notes=$(node scripts/changelog-notes.mjs web "$VERSION")
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "content<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: reconstruct latest.json from release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_NOTES: ${{ steps.desktop_notes.outputs.content }}
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
        run: |
          set -eo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.desktop_version }}"

          # Fetch release metadata and assets
          pub_date=$(gh release view "$tag" --json publishedAt -q '.publishedAt')
          assets_json=$(gh release view "$tag" --json assets -q '.assets')

          # Download all updater signature files
          mkdir -p /tmp/sigs
          gh release download "$tag" -p "*.sig" -D /tmp/sigs 2>/dev/null || true

          # Identify updater artifacts per platform. `bundle.createUpdaterArtifacts: "v1Compatible"` keeps Tauri 1's
          # archive names: installs still on 1.x can only install those, and Tauri 2 reads them too.
          mac_arm_name=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".app.tar.gz"))
                 | select(.name | contains("x64") | not)]
            | .[0].name // empty')
          mac_arm_url=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".app.tar.gz"))
                 | select(.name | contains("x64") | not)]
            | .[0].url // empty')

          mac_intel_name=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".app.tar.gz"))
                 | select(.name | contains("x64"))]
            | .[0].name // empty')
          mac_intel_url=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".app.tar.gz"))
                 | select(.name | contains("x64"))]
            | .[0].url // empty')

          linux_name=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".AppImage.tar.gz"))]
            | .[0].name // empty')
          linux_url=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".AppImage.tar.gz"))]
            | .[0].url // empty')

          windows_msi_name=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".msi.zip"))]
            | .[0].name // empty')
          windows_msi_url=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".msi.zip"))]
            | .[0].url // empty')

          windows_nsis_name=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".nsis.zip"))]
            | .[0].name // empty')
          windows_nsis_url=$(echo "$assets_json" | jq -r '
            [.[] | select(.name | endswith(".nsis.zip"))]
            | .[0].url // empty')

          # Build platforms JSON object
          platforms="{}"

          add_platform() {
            local key="$1" name="$2" url="$3"
            [ -z "$name" ] && return
            [ -z "$url" ] && return
            local sig_file="/tmp/sigs/${name}.sig"
            [ -f "$sig_file" ] || return
            local sig
            sig=$(cat "$sig_file")
            platforms=$(echo "$platforms" | jq \
              --arg key "$key" --arg sig "$sig" --arg url "$url" \
              '.[$key] = {signature: $sig, url: $url}')
          }

          add_platform "darwin-aarch64"          "$mac_arm_name"      "$mac_arm_url"
          add_platform "darwin-aarch64-app"      "$mac_arm_name"      "$mac_arm_url"
          add_platform "darwin-x86_64"           "$mac_intel_name"    "$mac_intel_url"
          add_platform "darwin-x86_64-app"       "$mac_intel_name"    "$mac_intel_url"
          add_platform "linux-x86_64"            "$linux_name"        "$linux_url"
          add_platform "linux-x86_64-appimage"   "$linux_name"        "$linux_url"
          add_platform "windows-x86_64"          "$windows_msi_name"  "$windows_msi_url"
          add_platform "windows-x86_64-msi"      "$windows_msi_name"  "$windows_msi_url"
          add_platform "windows-x86_64-nsis"     "$windows_nsis_name" "$windows_nsis_url"

          # Construct the complete latest.json
          jq -n \
            --arg version "$version" \
            --arg notes "$DESKTOP_NOTES" \
            --arg pub_date "$pub_date" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > /tmp/latest.json

          echo "::group::Reconstructed latest.json"
          jq . /tmp/latest.json
          echo "::endgroup::"

          gh release upload "$tag" /tmp/latest.json --clobber

          # A desktop-only release isn't the latest: the latest one's manifest, which installed apps and the website read,
          # now points to it.
          if [ "$DESKTOP_ONLY" = "true" ]; then
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
            gh release upload "$latest_tag" /tmp/latest.json --clobber
            echo "latest.json of $latest_tag now offers desktop $version ($tag)"
          fi
