[package]
name = "fastmemo"
version = "1.1.1"
description = "Fast Memo - Notes in one click"
authors = ["ontech7"]
license = "GNU Affero General Public License v3.0"
repository = "http://github.com/ontech7/fastmemo-app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "updater", "process-relaunch", "shell-open", "dialog-all", "fs-all", "path-all", "notification-all", "clipboard-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Desktop biometric unlock is scoped to macOS (Touch ID) and Windows (Hello), so
# `robius-authentication` is a target-specific dependency. On Linux it would pull
# in `polkit-sys` (needs the system `polkit-gobject-1` lib); we intentionally skip
# it there — Linux stays on the secret code (see the frontend gate in
# src/libs/biometric.ts and the cfg'd `biometric_authenticate` stub in main.rs).

# macOS: titlebar tint (#05091A) + biometric unlock.
# cocoa is pinned to what tao/wry already resolve, so nothing extra compiles.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
robius-authentication = "0.1.1"

# Windows: biometric unlock (Windows Hello).
[target.'cfg(target_os = "windows")'.dependencies]
robius-authentication = "0.1.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
