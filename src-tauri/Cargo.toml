[package]
name = "fastmemo"
version = "1.2.0"
description = "Fast Memo - Notes in one click"
authors = ["ontech7"]
license = "GNU Affero General Public License v3.0"
repository = "http://github.com/ontech7/fastmemo-app"
edition = "2021"

# Split per Tauri 2's layout: everything lives in lib.rs, main.rs only calls `run()`. Desktop only, so just the rlib
# (staticlib/cdylib are for mobile targets and would triple the fat-LTO link of every release build).
[lib]
name = "fastmemo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The FastMemo server and webhooks, called from Rust (src/net.rs). reqwest 0.13, rustls and tokio are already in the app
# through tauri-plugin-updater: the same versions, ring as the crypto provider, the OS verifying certificates.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

# Desktop biometric unlock is scoped to macOS (Touch ID) and Windows (Hello), so
# `robius-authentication` is a target-specific dependency. On Linux it would pull
# in `polkit-sys` (needs the system `polkit-gobject-1` lib); we intentionally skip
# it there — Linux stays on the secret code (see the frontend gate in
# src/libs/biometric.ts and the cfg'd `biometric_authenticate` stub in lib.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
robius-authentication = "0.1.1"

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
